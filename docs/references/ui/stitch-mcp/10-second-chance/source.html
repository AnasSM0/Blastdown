        .glass-block-cyan {

        @keyframes float-pulse {
            0%, 100% { opacity: 0.8; transform: translateY(0) scale(1); text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
            50% { opacity: 1; transform: translateY(-2px) scale(1.02); text-shadow: 0 0 20px rgba(0, 240, 255, 0.8); }
        }
        
        @keyframes wave-sweep {
            0% { transform: translateY(0); opacity: 0.8; height: 3px; }
            100% { transform: translateY(60px); opacity: 0; height: 1px; }
        }

        .animate-label {
            animation: float-pulse 3s ease-in-out infinite;
        }

        .animate-wave {
            animation: wave-sweep 2s cubic-bezier(0.2, 0, 0, 1) forwards;
