<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BlastDown Tutorial - Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary": "#4b007e",
                    "on-error-container": "#ffdad6",
                    "inverse-on-surface": "#283044",
                    "tertiary-fixed": "#ffdea8",
                    "on-primary-fixed": "#002022",
                    "surface-bright": "#31394d",
                    "secondary-fixed-dim": "#dfb7ff",
                    "on-secondary-fixed": "#2d004f",
                    "surface": "#0b1326",
                    "surface-container-lowest": "#060e20",
                    "error-container": "#93000a",
                    "surface-dim": "#0b1326",
                    "on-tertiary-fixed": "#271900",
                    "secondary-fixed": "#f1daff",
                    "on-error": "#690005",
                    "outline": "#849495",
                    "on-tertiary-fixed-variant": "#5e4200",
                    "on-tertiary-container": "#7d5800",
                    "primary": "#dbfcff",
                    "on-surface": "#dae2fd",
                    "primary-fixed": "#7df4ff",
                    "on-primary-container": "#006970",
                    "tertiary-container": "#ffd386",
                    "primary-container": "#00f0ff",
                    "surface-container-highest": "#2d3449",
                    "secondary-container": "#9d05ff",
                    "inverse-primary": "#006970",
                    "primary-fixed-dim": "#00dbe9",
                    "surface-container": "#171f33",
                    "on-background": "#dae2fd",
                    "tertiary": "#fff4e8",
                    "surface-tint": "#00dbe9",
                    "outline-variant": "#3b494b",
                    "on-secondary-fixed-variant": "#6b00b0",
                    "tertiary-fixed-dim": "#ffba20",
                    "background": "#0b1326",
                    "error": "#ffb4ab",
                    "surface-variant": "#2d3449",
                    "surface-container-high": "#222a3d",
                    "inverse-surface": "#dae2fd",
                    "secondary": "#dfb7ff",
                    "on-secondary-container": "#f7e6ff",
                    "on-tertiary": "#412d00",
                    "on-primary-fixed-variant": "#004f54",
                    "on-surface-variant": "#b9cacb",
                    "on-primary": "#00363a",
                    "surface-container-low": "#131b2e"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "grid-cell": "40px",
                    "stack-xs": "4px",
                    "stack-sm": "8px",
                    "container-padding": "20px",
                    "grid-gutter": "2px",
                    "section-gap": "32px"
            },
            "fontFamily": {
                    "timer-mono": ["JetBrains Mono"],
                    "button-text": ["Geist"],
                    "body-standard": ["Geist"],
                    "score-display-mobile": ["JetBrains Mono"],
                    "score-display": ["JetBrains Mono"],
                    "label-caps": ["Geist"]
            },
            "fontSize": {
                    "timer-mono": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                    "button-text": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                    "body-standard": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                    "score-display-mobile": ["36px", { "lineHeight": "36px", "fontWeight": "700" }],
                    "score-display": ["48px", { "lineHeight": "48px", "letterSpacing": "-0.05em", "fontWeight": "700" }],
                    "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "600" }]
            }
          }
        }
      }
    </script>
<style>
        .inner-glow-cell {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }
        @keyframes subtle-pulse {
            0%, 100% { box-shadow: 0 0 12px rgba(255,186,32,0.3), inset 0 0 8px rgba(255,186,32,0.1); }
            50% { box-shadow: 0 0 20px rgba(255,186,32,0.6), inset 0 0 12px rgba(255,186,32,0.2); }
        }
        .amber-neon-pulse {
            animation: subtle-pulse 2s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-standard h-[884px] w-full flex flex-col overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<header class="flex justify-between items-center w-full px-container-padding h-16 bg-surface dark:bg-surface text-tertiary-fixed-dim dark:text-tertiary-fixed-dim font-score-display-mobile text-score-display-mobile docked full-width top-0 z-50 flex-shrink-0">
<button class="hover:opacity-80 scale-95 transition-transform flex items-center justify-center p-2 rounded-full focus:outline-none focus:ring-1 focus:ring-tertiary-fixed-dim">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">trophy</span>
</button>
<div class="font-bold tracking-tight">0000</div>
<button class="hover:opacity-80 scale-95 transition-transform flex items-center justify-center p-2 rounded-full focus:outline-none focus:ring-1 focus:ring-tertiary-fixed-dim">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
</header>
<main class="flex-grow flex flex-col items-center justify-center w-full relative pb-24">
<div class="relative bg-surface-container rounded-xl p-[2px] border border-outline-variant/40 shadow-[0_8px_32px_rgba(0,0,0,0.4)]">
<div class="grid grid-cols-8 grid-rows-8 gap-grid-gutter relative" id="reactor-grid">
<script>
                    const grid = document.getElementById('reactor-grid');
                    for(let i=0; i<64; i++) {
                        const cell = document.createElement('div');
                        cell.className = 'w-grid-cell h-grid-cell bg-surface-dim border border-outline-variant/30 rounded-sm inner-glow-cell';
                        grid.appendChild(cell);
                    }
                </script>
<div class="absolute w-[82px] h-[82px] top-[126px] left-[126px] bg-white/5 backdrop-blur-[16px] border border-tertiary-fixed-dim rounded-lg flex items-center justify-center z-20 amber-neon-pulse pointer-events-none">
<div class="w-10 h-10 rounded-full bg-surface border border-tertiary-fixed-dim flex items-center justify-center shadow-[0_0_12px_rgba(255,186,32,0.5)]">
<span class="font-timer-mono text-timer-mono text-tertiary-fixed-dim leading-none mt-[2px]">7</span>
</div>
</div>
</div>
</div>
<div class="mt-section-gap px-container-padding text-center relative z-10 w-full max-w-[360px]">
<p class="font-body-standard text-body-standard text-inverse-surface opacity-90 drop-shadow-md">
                Every placed piece has a move countdown
            </p>
</div>
</main>
<div class="absolute bottom-8 left-0 w-full px-container-padding flex justify-center z-50">
<button class="w-full max-w-[320px] h-[56px] bg-primary-container/10 border border-primary-fixed-dim text-primary-fixed-dim font-button-text text-button-text rounded-full flex items-center justify-center tracking-widest shadow-[0_0_15px_rgba(0,219,233,0.15),inset_0_0_8px_rgba(0,219,233,0.1)] hover:bg-primary-container/20 hover:shadow-[0_0_20px_rgba(0,219,233,0.3)] transition-all active:scale-95 duration-150 focus:outline-none focus:ring-2 focus:ring-primary-fixed-dim focus:ring-offset-2 focus:ring-offset-surface">
            CONTINUE
        </button>
</div>
</body></html>
