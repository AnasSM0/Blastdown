<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>BlastDown - Normal Gameplay</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary": "#412d00",
                        "on-surface": "#dae2fd",
                        "primary-fixed": "#7df4ff",
                        "secondary-fixed": "#f1daff",
                        "on-surface-variant": "#b9cacb",
                        "on-secondary-fixed": "#2d004f",
                        "surface": "#0b1326",
                        "outline": "#849495",
                        "surface-dim": "#0b1326",
                        "tertiary-fixed": "#ffdea8",
                        "on-tertiary-fixed-variant": "#5e4200",
                        "surface-container-lowest": "#060e20",
                        "on-primary": "#00363a",
                        "primary-fixed-dim": "#00dbe9",
                        "secondary-fixed-dim": "#dfb7ff",
                        "on-background": "#dae2fd",
                        "surface-container-low": "#131b2e",
                        "surface-container-highest": "#2d3449",
                        "on-tertiary-container": "#7d5800",
                        "on-primary-fixed": "#002022",
                        "surface-container": "#171f33",
                        "outline-variant": "#3b494b",
                        "on-primary-fixed-variant": "#004f54",
                        "secondary-container": "#9d05ff",
                        "inverse-surface": "#dae2fd",
                        "on-secondary": "#4b007e",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#6b00b0",
                        "surface-container-high": "#222a3d",
                        "tertiary-fixed-dim": "#ffba20",
                        "background": "#0b1326",
                        "on-primary-container": "#006970",
                        "surface-tint": "#00dbe9",
                        "on-error": "#690005",
                        "on-secondary-container": "#f7e6ff",
                        "primary": "#dbfcff",
                        "tertiary": "#fff4e8",
                        "surface-variant": "#2d3449",
                        "error": "#ffb4ab",
                        "inverse-primary": "#006970",
                        "primary-container": "#00f0ff",
                        "surface-bright": "#31394d",
                        "tertiary-container": "#ffd386",
                        "on-tertiary-fixed": "#271900",
                        "secondary": "#dfb7ff",
                        "error-container": "#93000a",
                        "inverse-on-surface": "#283044"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "stack-xs": "4px",
                        "container-padding": "20px",
                        "section-gap": "32px",
                        "stack-sm": "8px",
                        "grid-cell": "40px",
                        "grid-gutter": "2px"
                    },
                    fontFamily: {
                        "button-text": ["Geist"],
                        "body-standard": ["Geist"],
                        "score-display": ["JetBrains Mono"],
                        "label-caps": ["Geist"],
                        "score-display-mobile": ["JetBrains Mono"],
                        "timer-mono": ["JetBrains Mono"]
                    },
                    fontSize: {
                        "button-text": ["14px", { lineHeight: "20px", letterSpacing: "0.02em", fontWeight: "600" }],
                        "body-standard": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "score-display": ["48px", { lineHeight: "48px", letterSpacing: "-0.05em", fontWeight: "700" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.1em", fontWeight: "600" }],
                        "score-display-mobile": ["36px", { lineHeight: "36px", fontWeight: "700" }],
                        "timer-mono": ["24px", { lineHeight: "32px", fontWeight: "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #050505; /* Deep matte black base as requested by prompt */
            color: #dae2fd;
            overflow: hidden;
            touch-action: none;
        }
        
        .glow-orange {
            text-shadow: 0 0 12px rgba(255, 107, 0, 0.4);
            color: #FF6B00;
        }

        .neon-inner-stroke-cyan {
            box-shadow: inset 0 0 0 1px #00f0ff, 0 0 8px rgba(0, 240, 255, 0.3);
            background-color: rgba(255,255,255,0.1);
            backdrop-filter: blur(16px);
        }

        .neon-inner-stroke-purple {
            box-shadow: inset 0 0 0 1px #9d05ff, 0 0 8px rgba(157, 5, 255, 0.3);
            background-color: rgba(255,255,255,0.1);
            backdrop-filter: blur(16px);
        }

        .neon-inner-stroke-amber {
            box-shadow: inset 0 0 0 1px #ffba20, 0 0 8px rgba(255, 186, 32, 0.3);
            background-color: rgba(255,255,255,0.1);
            backdrop-filter: blur(16px);
        }

        .glass-block {
            background-color: rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .grid-cell {
            border: 1px solid #2D2D35; /* Graphite */
            background-color: #0F172A; /* Deep navy */
        }
        
        /* Grid definitions */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 380px;
            margin: 0 auto;
        }
        
        .tray-grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            width: 60px;
            height: 60px;
        }

        /* Powerup button */
        .powerup-btn {
            border: 1px solid #2D2D35;
            transition: all 0.2s ease;
        }
        .powerup-btn:active {
            background-color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            border-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col h-screen w-full items-center justify-between font-body-standard relative bg-background">
<!-- TopAppBar Structure -->
<header class="flex justify-between items-center w-full px-container-padding h-16 bg-transparent flex-shrink-0 z-10 pt-4">
<!-- Leading: Best Score -->
<div class="flex flex-col items-start w-1/4">
<span class="font-label-caps text-label-caps text-outline uppercase">Best</span>
<span class="font-timer-mono text-timer-mono text-surface-tint">14,200</span>
</div>
<!-- Center: Current Score -->
<div class="flex-1 flex justify-center items-center">
<h1 class="font-score-display-mobile text-score-display-mobile glow-orange tracking-tight">
                0000
            </h1>
</div>
<!-- Trailing: Pause Icon -->
<div class="w-1/4 flex justify-end">
<button aria-label="Pause Game" class="text-outline hover:opacity-80 scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">pause</span>
</button>
</div>
</header>
<!-- Main Game Canvas -->
<main class="flex-1 w-full flex flex-col items-center justify-center px-container-padding pb-section-gap pt-stack-sm relative z-0">
<!-- The Core (8x8 Grid) -->
<div class="board-grid border border-outline-variant p-[2px] bg-surface-container-lowest rounded-sm shadow-[inset_0_0_20px_rgba(0,0,0,0.8)] relative">
<!-- Grid Cells Generation -->
<script>
                // Simple script to generate the 64 cells to keep HTML somewhat clean
                for(let i=0; i<64; i++) {
                    document.write('<div class="grid-cell rounded-sm w-full h-full relative"></div>');
                }
            </script>
<!-- Overlay Pieces -->
<!-- Cyan L-Shape -->
<div class="absolute top-[2px] left-[2px] w-[calc(100%-4px)] h-[calc(100%-4px)] pointer-events-none grid grid-cols-8 grid-rows-8 gap-[2px]">
<!-- Cyan cluster -->
<div class="col-start-3 row-start-4 w-full h-full rounded-sm neon-inner-stroke-cyan relative z-10"></div>
<div class="col-start-3 row-start-5 w-full h-full rounded-sm neon-inner-stroke-cyan relative z-10"></div>
<div class="col-start-4 row-start-5 w-full h-full rounded-sm neon-inner-stroke-cyan relative z-10"></div>
<!-- Purple Line with Badge -->
<div class="col-start-6 row-start-2 w-full h-full rounded-sm neon-inner-stroke-purple relative z-10"></div>
<div class="col-start-6 row-start-3 w-full h-full rounded-sm neon-inner-stroke-purple relative z-10 flex items-center justify-center">
<!-- Mono Badge Shared Countdown -->
<div class="absolute w-6 h-6 bg-surface-container-lowest rounded-full border border-secondary-fixed flex items-center justify-center z-20 shadow-md neon-inner-stroke-cyan">
<span class="font-timer-mono text-[12px] text-secondary-fixed leading-none">1</span>
</div>
</div>
<div class="col-start-6 row-start-4 w-full h-full rounded-sm neon-inner-stroke-purple relative z-10"></div>
</div>
</div>
<!-- The Tray (Next Pieces) -->
<div class="w-full max-w-[380px] mt-section-gap flex justify-between items-center px-stack-sm h-24">
<!-- Piece 1: Amber Dot -->
<div class="tray-grid-3x3 glass-block rounded-lg p-2 flex-shrink-0 cursor-pointer hover:scale-105 transition-transform">
<div class="col-start-2 row-start-2 w-full h-full rounded-sm neon-inner-stroke-amber"></div>
</div>
<!-- Piece 2: Cyan Line -->
<div class="tray-grid-3x3 glass-block rounded-lg p-2 flex-shrink-0 cursor-pointer hover:scale-105 transition-transform">
<div class="col-start-1 row-start-2 w-full h-full rounded-sm neon-inner-stroke-cyan"></div>
<div class="col-start-2 row-start-2 w-full h-full rounded-sm neon-inner-stroke-cyan"></div>
<div class="col-start-3 row-start-2 w-full h-full rounded-sm neon-inner-stroke-cyan"></div>
</div>
<!-- Piece 3: Purple Square -->
<div class="tray-grid-3x3 glass-block rounded-lg p-2 flex-shrink-0 cursor-pointer hover:scale-105 transition-transform">
<div class="col-start-1 row-start-1 w-full h-full rounded-sm neon-inner-stroke-purple"></div>
<div class="col-start-2 row-start-1 w-full h-full rounded-sm neon-inner-stroke-purple"></div>
<div class="col-start-1 row-start-2 w-full h-full rounded-sm neon-inner-stroke-purple"></div>
<div class="col-start-2 row-start-2 w-full h-full rounded-sm neon-inner-stroke-purple"></div>
</div>
</div>
</main>
<!-- BottomNavBar / Powerups -->
<div class="fixed bottom-28 left-1/2 -translate-x-1/2 w-[calc(100%-40px)] max-w-[340px] bg-surface-container-low border border-outline-variant rounded-xl p-4 z-50 shadow-2xl flex flex-col items-center gap-4">
<p class="font-body-standard text-on-surface text-center">Defuse this piece?</p>
<div class="flex flex-col w-full gap-2">
<button class="w-full py-3 rounded-lg bg-primary-container text-on-primary-container font-button-text uppercase tracking-wider neon-inner-stroke-cyan hover:opacity-90 transition-opacity">
            WATCH &amp; DEFUSE
        </button>
<button class="w-full py-2 text-outline font-button-text uppercase text-[12px] hover:text-on-surface transition-colors">
            CANCEL
        </button>
</div>
</div><nav class="fixed bottom-0 w-full z-50 flex justify-center gap-section-gap pb-10 bg-transparent flex-shrink-0">
<!-- Freeze Powerup -->
<button aria-label="Freeze" class="flex flex-col items-center justify-center text-outline border border-outline-variant rounded-full p-stack-sm w-12 h-12 powerup-btn hover:bg-surface-container-highest transition-colors group">
<span class="material-symbols-outlined text-outline group-active:text-on-primary-container" style="font-variation-settings: 'FILL' 0;">ac_unit</span>
</button>
<!-- Defuse Powerup -->
<button aria-label="Defuse" class="flex flex-col items-center justify-center text-outline border border-outline-variant rounded-full p-stack-sm w-12 h-12 powerup-btn hover:bg-surface-container-highest transition-colors group neon-inner-stroke-cyan">
<span class="material-symbols-outlined text-outline group-active:text-on-primary-container" style="font-variation-settings: 'FILL' 0;">bolt</span>
</button>
</nav>
<div class="fixed inset-0 bg-black/40 backdrop-blur-[2px] z-40 pointer-events-none"></div></body></html>
