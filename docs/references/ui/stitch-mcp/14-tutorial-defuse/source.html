<style>
        .grid-bg {
            background-color: #0F172A; /* Requested in prompt for grid container */
        }
        .grid-border {
            border-color: #2D2D35; /* Graphite */
        }
        
        .pulse-red {
            animation: pulseRed 1s infinite alternate;
        }
        @keyframes pulseRed {
            0% { box-shadow: inset 0 0 0 1px #FF003D, 0 0 10px rgba(255, 0, 61, 0.5); border-color: #FF003D; }
            100% { box-shadow: inset 0 0 0 1px #FF003D, 0 0 20px rgba(255, 0, 61, 0.9); border-color: #FF003D; }
        }

        .row-highlight {
            background-color: rgba(0, 240, 255, 0.15); /* primary-container with opacity */
            box-shadow: inset 0 0 0 1px #00f0ff;
        }
        
        .glow-cyan {
            box-shadow: inset 0 0 0 1px #00f0ff, 0 0 12px rgba(0, 240, 255, 0.6);
            background-color: rgba(255,255,255,0.1);
            backdrop-filter: blur(16px);
        }
        
        .glass-purple {
            background-color: rgba(255,255,255,0.1);
            backdrop-filter: blur(16px);
            box-shadow: inset 0 0 0 1px #dfb7ff; /* secondary-fixed-dim */
        }
        
        .glass-red {
            background-color: rgba(255,255,255,0.1);
            backdrop-filter: blur(16px);
            /* Red handled by pulse-red */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#050505] text-on-surface h-screen w-screen overflow-hidden flex flex-col items-center">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-container-padding h-16 bg-surface dark:bg-surface text-tertiary-fixed-dim font-score-display-mobile text-score-display-mobile docked full-width top-0 z-50">
<div class="hover:opacity-80 scale-95 transition-transform cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">trophy</span>
</div>
<div class="text-tertiary-fixed-dim font-score-display-mobile text-score-display-mobile font-bold tracking-tight">0000</div>
<div class="hover:opacity-80 scale-95 transition-transform cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pause</span>
</div>
</header>
<!-- Main Game Area -->
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-md px-container-padding pb-24">
<!-- Instruction Text -->
<div class="mb-section-gap text-center font-body-standard text-body-standard text-on-surface-variant max-w-[280px]">
            Clear every cell before it reaches zero
        </div>
<!-- The Core Grid (8x8) -->
<div class="grid-bg p-grid-gutter rounded border border-grid-border relative">
<!-- Row Highlight Overlay -->
<div class="absolute top-[210px] left-grid-gutter right-grid-gutter h-[40px] row-highlight pointer-events-none rounded-sm z-10"></div>
<div class="grid grid-cols-8 grid-rows-8 gap-grid-gutter">
<!-- Generate 64 cells -->
<script>
                    for(let i=0; i<64; i++) {
                        // Cell rendering logic
                        let cellClasses = "w-[40px] h-[40px] border border-grid-border rounded-sm relative z-0";
                        let innerContent = "";
                        
                        const row = Math.floor(i/8);
                        const col = i%8;

                        // Place purple I-piece (horizontal, length 3) at row 5, cols 3,4,5
                        // One of them is a red timer block
                        if(row === 5) {
                            if (col === 3) {
                                cellClasses = "w-[40px] h-[40px] rounded-sm relative z-20 glass-purple";
                            } else if (col === 4) {
                                cellClasses = "w-[40px] h-[40px] rounded-sm relative z-20 glass-red pulse-red flex items-center justify-center";
                                innerContent = `<span class="font-timer-mono text-timer-mono text-[#FF003D]">1</span>`;
                            } else if (col === 5) {
                                cellClasses = "w-[40px] h-[40px] rounded-sm relative z-20 glass-purple";
                            }
                        }

                        document.write(`<div class="${cellClasses}">${innerContent}</div>`);
                    }
                </script>
</div>
</div>
<!-- The Tray -->
<div class="mt-section-gap w-full flex justify-center gap-section-gap h-24 items-center">
<!-- Tray slot 1 -->
<div class="w-16 h-16 flex items-center justify-center">
<!-- Empty or different piece -->
</div>
<!-- Tray slot 2 - Selected Cyan Piece -->
<div class="w-16 h-16 flex items-center justify-center relative -translate-y-4 transition-transform">
<div class="w-[40px] h-[40px] glow-cyan rounded-sm"></div>
</div>
<!-- Tray slot 3 -->
<div class="w-16 h-16 flex items-center justify-center">
<!-- Empty or different piece -->
</div>
</div>
</main>
<!-- BottomNavBar (Hidden on this screen as it's a focused tutorial flow, as per Semantic Shell Mandate) -->
</body></html>
